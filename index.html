<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VOSSTEN — The Vossten Way</title>
  <meta name="description" content="VOSSTEN. The Vossten Way. Established 2026.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 50% 18%, #191919 0%, #0c0c0c 42%, #050505 100%);
      color: #f2eee5;
      font-family: 'Montserrat', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.025;
      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          transparent 0,
          #ffffff 1px,
          transparent 2px
        );
      background-size: 8px 8px;
    }

    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 55px 24px 28px;
    }

    .brand {
      width: 100%;
      max-width: 900px;
      margin: auto 0;
    }

    /* REAL VOSSTEN LOGO */

    .logo-wrap {
      margin: 0 auto 26px;
      opacity: 0;
      animation: logoReveal 1s ease forwards;
    }

    .logo-wrap img {
      width: 92px;
      max-width: 24vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* WORDMARK */

    .wordmark {
      font-size: clamp(46px, 10vw, 100px);
      font-weight: 800;
      letter-spacing: clamp(7px, 2vw, 17px);
      line-height: 1;
      margin-right: -17px;
      opacity: 0;
      animation: reveal 1s ease 0.2s forwards;
    }

    .est {
      margin-top: 22px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 7px;
      color: rgba(242,238,229,0.5);
      opacity: 0;
      animation: reveal 1s ease 0.35s forwards;
    }

    .divider {
      width: 85px;
      height: 1px;
      margin: 55px auto;
      background: rgba(242,238,229,0.35);
      opacity: 0;
      animation: lineReveal 1.2s ease 0.5s forwards;
    }

    /* BRAND MESSAGE */

    .way {
      font-size: clamp(17px, 4vw, 27px);
      font-weight: 500;
      letter-spacing: clamp(5px, 1.5vw, 10px);
      margin-right: -10px;
      opacity: 0;
      animation: reveal 1s ease 0.65s forwards;
    }

    .coming {
      margin-top: 24px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(242,238,229,0.52);
      opacity: 0;
      animation: reveal 1s ease 0.8s forwards;
    }

    /* COMING SOON */

    .launch {
      margin: 45px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 18px;
      border: 1px solid rgba(242,238,229,0.18);
      opacity: 0;
      animation: reveal 1s ease 0.95s forwards;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f2eee5;
      animation: pulse 2s infinite;
    }

    .launch span {
      font-size: 8px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(242,238,229,0.65);
    }

    /* SOCIAL LINKS */

    .socials {
      margin-top: 55px;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      opacity: 0;
      animation: reveal 1s ease 1.1s forwards;
    }

    .socials a {
      position: relative;
      color: rgba(242,238,229,0.5);
      text-decoration: none;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: 0.3s ease;
    }

    .socials a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 1px;
      left: 0;
      bottom: -7px;
      background: #f2eee5;
      transition: width 0.3s ease;
    }

    .socials a:hover {
      color: #f2eee5;
    }

    .socials a:hover::after {
      width: calc(100% - 3px);
    }

    /* FOOTER */

    footer {
      width: 100%;
      margin-top: 65px;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(242,238,229,0.25);
      opacity: 0;
      animation: reveal 1s ease 1.25s forwards;
    }

    /* ANIMATIONS */

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoReveal {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes lineReveal {
      from {
        opacity: 0;
        width: 0;
      }

      to {
        opacity: 1;
        width: 85px;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
      }

      50% {
        opacity: 1;
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page {
        padding: 45px 20px 25px;
      }

      .logo-wrap {
        margin-bottom: 25px;
      }

      .logo-wrap img {
        width: 84px;
        max-width: 26vw;
      }

      .wordmark {
        font-size: 48px;
        letter-spacing: 8px;
        margin-right: -8px;
      }

      .est {
        font-size: 9px;
        letter-spacing: 6px;
      }

      .divider {
        margin: 48px auto;
      }

      .way {
        font-size: 17px;
        letter-spacing: 6px;
        margin-right: -6px;
      }

      .coming {
        font-size: 9px;
        letter-spacing: 3.5px;
        line-height: 1.8;
      }

      .launch {
        margin-top: 38px;
      }

      .socials {
        gap: 23px;
        margin-top: 48px;
      }

      .socials a {
        font-size: 8px;
        letter-spacing: 2px;
      }

      footer {
        margin-top: 55px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="brand">

      <!-- REAL VOSSTEN V -->
      <div class="logo-wrap">
        <img src="vossten-v.png" alt="Vossten V Logo">
      </div>

      <h1 class="wordmark">VOSSTEN</h1>

      <p class="est">EST. 2026</p>

      <div class="divider"></div>

      <h2 class="way">THE VOSSTEN WAY</h2>

      <p class="coming">
        The first chapter is coming.
      </p>

      <div class="launch">
        <div class="dot"></div>
        <span>Coming Soon</span>
      </div>

      <div class="socials">

        <a href="#" target="_blank" rel="noopener noreferrer">
          Instagram
        </a>

        <a href="#" target="_blank" rel="noopener noreferrer">
          TikTok
        </a>

        <a href="#" target="_blank" rel="noopener noreferrer">
          Facebook
        </a>

      </div>

    </section>

    <footer>
      © 2026 VOSSTEN &nbsp; • &nbsp; ALL RIGHTS RESERVED
    </footer>

  </main>

</body>
</html>
