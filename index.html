<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VOSSTEN — The Vossten Way</title>
  <meta name="description" content="VOSSTEN. The Vossten Way. Established 2026.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 50% 20%, #1b1b1b 0%, #0d0d0d 38%, #050505 100%);
      color: #f1eee6;
      font-family: 'Montserrat', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle grain effect */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          transparent 0,
          #ffffff 1px,
          transparent 2px
        );
      background-size: 8px 8px;
    }

    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 55px 25px 30px;
    }

    /* ---------- BRAND ---------- */

    .brand {
      width: 100%;
      max-width: 900px;
      margin: auto 0;
    }

    /* Custom angular V */
    .v-logo {
      width: 76px;
      height: 66px;
      margin: 0 auto 28px;
      position: relative;
      opacity: 0;
      animation: logoReveal 1s ease forwards;
    }

    .v-left,
    .v-right {
      position: absolute;
      top: 0;
      width: 13px;
      height: 70px;
      background: #f1eee6;
    }

    .v-left {
      left: 19px;
      transform: rotate(-25deg);
      transform-origin: top center;
    }

    .v-right {
      right: 19px;
      transform: rotate(25deg);
      transform-origin: top center;
    }

    .wordmark {
      font-size: clamp(46px, 10vw, 100px);
      font-weight: 800;
      letter-spacing: clamp(7px, 2vw, 17px);
      line-height: 1;
      margin-right: -17px;
      opacity: 0;
      animation: reveal 1s ease 0.2s forwards;
    }

    .est {
      margin-top: 22px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 7px;
      color: rgba(241,238,230,0.5);
      opacity: 0;
      animation: reveal 1s ease 0.35s forwards;
    }

    .divider {
      width: 85px;
      height: 1px;
      margin: 55px auto;
      background: rgba(241,238,230,0.35);
      opacity: 0;
      animation: lineReveal 1.2s ease 0.5s forwards;
    }

    /* ---------- MESSAGE ---------- */

    .way {
      font-size: clamp(17px, 4vw, 27px);
      font-weight: 500;
      letter-spacing: clamp(5px, 1.5vw, 10px);
      margin-right: -10px;
      opacity: 0;
      animation: reveal 1s ease 0.65s forwards;
    }

    .coming {
      margin-top: 24px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(241,238,230,0.52);
      opacity: 0;
      animation: reveal 1s ease 0.8s forwards;
    }

    /* ---------- LAUNCH ---------- */

    .launch {
      margin: 45px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 18px;
      border: 1px solid rgba(241,238,230,0.18);
      opacity: 0;
      animation: reveal 1s ease 0.95s forwards;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f1eee6;
      animation: pulse 2s infinite;
    }

    .launch span {
      font-size: 8px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(241,238,230,0.65);
    }

    /* ---------- SOCIALS ---------- */

    .socials {
      margin-top: 55px;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      opacity: 0;
      animation: reveal 1s ease 1.1s forwards;
    }

    .socials a {
      position: relative;
      color: rgba(241,238,230,0.5);
      text-decoration: none;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: 0.3s ease;
    }

    .socials a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 1px;
      left: 0;
      bottom: -7px;
      background: #f1eee6;
      transition: width 0.3s ease;
    }

    .socials a:hover {
      color: #f1eee6;
    }

    .socials a:hover::after {
      width: calc(100% - 3px);
    }

    /* ---------- FOOTER ---------- */

    footer {
      width: 100%;
      margin-top: 65px;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(241,238,230,0.25);
      opacity: 0;
      animation: reveal 1s ease 1.25s forwards;
    }

    /* ---------- ANIMATIONS ---------- */

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoReveal {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.92);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes lineReveal {
      from {
        opacity: 0;
        width: 0;
      }

      to {
        opacity: 1;
        width: 85px;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
      }

      50% {
        opacity: 1;
      }
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 600px) {

      .page {
        padding: 45px 20px 25px;
      }

      .v-logo {
        width: 62px;
        height: 56px;
        margin-bottom: 27px;
      }

      .v-left,
      .v-right {
        width: 11px;
        height: 59px;
      }

      .v-left {
        left: 16px;
      }

      .v-right {
        right: 16px;
      }

      .wordmark {
        font-size: 48px;
        letter-spacing: 8px;
        margin-right: -8px;
      }

      .est {
        font-size: 9px;
        letter-spacing: 6px;
      }

      .divider {
        margin: 48px auto;
      }

      .way {
        font-size: 17px;
        letter-spacing: 6px;
        margin-right: -6px;
      }

      .coming {
        font-size: 9px;
        letter-spacing: 3.5px;
        line-height: 1.8;
      }

      .launch {
        margin-top: 38px;
      }

      .socials {
        gap: 23px;
        margin-top: 48px;
      }

      .socials a {
        font-size: 8px;
        letter-spacing: 2px;
      }

      footer {
        margin-top: 55px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="brand">

      <!-- VOSSTEN V MARK -->
      <div class="v-logo">
        <div class="v-left"></div>
        <div class="v-right"></div>
      </div>

      <!-- WORDMARK -->
      <h1 class="wordmark">VOSSTEN</h1>

      <p class="est">EST. 2026</p>

      <div class="divider"></div>

      <!-- BRAND MESSAGE -->
      <h2 class="way">THE VOSSTEN WAY</h2>

      <p class="coming">
        The first chapter is coming.
      </p>

      <!-- COMING SOON STATUS -->
      <div class="launch">
        <div class="dot"></div>
        <span>Coming Soon</span>
      </div>

      <!-- SOCIAL MEDIA -->
      <div class="socials">

        <!-- Replace # with your Instagram URL -->
        <a href="#" target="_blank">
          Instagram
        </a>

        <!-- Replace # with your TikTok URL -->
        <a href="#" target="_blank">
          TikTok
        </a>

        <!-- Replace # with your Facebook URL -->
        <a href="#" target="_blank">
          Facebook
        </a>

      </div>

    </section>

    <footer>
      © 2026 VOSSTEN &nbsp; • &nbsp; ALL RIGHTS RESERVED
    </footer>

  </main>

</body>
</html>
