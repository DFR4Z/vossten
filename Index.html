<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VOSSTEN — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      color: #f4f1e8;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .symbol {
      font-size: 70px;
      font-weight: 900;
      letter-spacing: -10px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(55px, 11vw, 110px);
      letter-spacing: 10px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .est {
      font-size: 13px;
      letter-spacing: 6px;
      opacity: 0.6;
      margin-bottom: 60px;
    }

    .line {
      width: 90px;
      height: 1px;
      background: #f4f1e8;
      margin: 0 auto 40px;
      opacity: 0.5;
    }

    h2 {
      font-size: clamp(20px, 4vw, 34px);
      letter-spacing: 7px;
      font-weight: 500;
      margin-bottom: 25px;
    }

    .coming {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 60px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .socials a {
      color: #f4f1e8;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.65;
      transition: 0.3s ease;
    }

    .socials a:hover {
      opacity: 1;
    }

    footer {
      margin-top: 80px;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.35;
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: 5px;
      }

      .est {
        margin-bottom: 45px;
      }

      .symbol {
        font-size: 55px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="symbol">V</div>

    <h1>VOSSTEN</h1>

    <p class="est">EST. 2026</p>

    <div class="line"></div>

    <h2>THE VOSSTEN WAY</h2>

    <p class="coming">
      Something is coming.
    </p>

    <div class="socials">
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">TikTok</a>
      <a href="#" target="_blank">Facebook</a>
    </div>

    <footer>
      © 2026 VOSSTEN. ALL RIGHTS RESERVED.
    </footer>

  </main>

</body>
</html>
